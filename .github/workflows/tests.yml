name: Tests

# Fast, deterministic tests on GitHub-hosted runners (no LLM, no secrets, no network:
# the MCP protocol tests read data/directory.ttl). The live SPARQL tests are in live-api.yml.
on:
  push:
  pull_request:

jobs:
  unit-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + MCP protocol tests (offline)
        run: pytest -m "not llm and not api" tests
